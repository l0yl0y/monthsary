    main {
      width: min(760px, 100%);
      text-align: center;
    }

    h1 {
      margin: 0 0 28px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.3rem, 7vw, 4.5rem);
      font-weight: 500;
      line-height: 1.12;
      text-wrap: balance;
      text-shadow: 0 3px 20px rgba(0, 0, 0, 0.38);
    }

    .card {
      padding: clamp(24px, 5vw, 42px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 28px;
      background: rgba(35, 28, 39, 0.53);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .intro {
      margin: 0 0 26px;
      color: rgba(255, 255, 255, 0.9);
      font-size: clamp(1rem, 2.5vw, 1.2rem);
    }

    .counter {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .unit {
      min-width: 0;
      padding: 18px 8px;
      border: 1px solid rgba(255, 255, 255, 0.19);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.1);
    }

    .value {
      display: block;
      font-size: clamp(1.7rem, 5vw, 2.8rem);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      line-height: 1.1;
    }

    .label {
      display: block;
      margin-top: 9px;
      color: rgba(255, 255, 255, 0.82);
      font-size: clamp(0.68rem, 1.8vw, 0.85rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .since {
      margin: 24px 0 0;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.9rem;
    }

    @media (max-width: 560px) {
      .counter {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .unit:last-child {
        grid-column: 1 / -1;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .card {
        animation: appear 900ms ease-out both;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Happy Monthsary My Bibicakess</h1>
    <section class="card" aria-label="Time together">
      <p class="intro">been bibi's partner for...</p>
      <div class="counter" role="timer" aria-live="off" aria-label="Time since March 16, 2023 at 4:00 PM">
        <div class="unit"><span class="value" id="months">0</span><span class="label">Months</span></div>
        <div class="unit"><span class="value" id="days">0</span><span class="label">Days</span></div>
        <div class="unit"><span class="value" id="hours">00</span><span class="label">Hours</span></div>
        <div class="unit"><span class="value" id="minutes">00</span><span class="label">Minutes</span></div>
        <div class="unit"><span class="value" id="seconds">00</span><span class="label">Seconds</span></div>
      </div>
      <p class="since">na since we sat in that bench sa Bacolod</p>
    </section>
  </main>

  <script>
    const start = new Date(2023, 2, 16, 16, 0, 0);
    const dayInMilliseconds = 24 * 60 * 60 * 1000;

    function updateCounter() {
      const now = new Date();
      let months = (now.getFullYear() - start.getFullYear()) * 12
        + now.getMonth() - start.getMonth();
      let monthStart = new Date(
        start.getFullYear(),
        start.getMonth() + months,
        start.getDate(),
        start.getHours(),
        start.getMinutes(),
        start.getSeconds()
      );

      if (monthStart > now) {
        months -= 1;
        monthStart = new Date(
          start.getFullYear(),
          start.getMonth() + months,
          start.getDate(),
          start.getHours(),
          start.getMinutes(),
          start.getSeconds()
        );
      }

      const elapsed = Math.max(0, now - monthStart);
      const days = Math.floor(elapsed / dayInMilliseconds);
      const hours = Math.floor((elapsed % dayInMilliseconds) / (60 * 60 * 1000));
      const minutes = Math.floor((elapsed % (60 * 60 * 1000)) / (60 * 1000));
      const seconds = Math.floor((elapsed % (60 * 1000)) / 1000);

      document.getElementById("months").textContent = months.toLocaleString();
      document.getElementById("days").textContent = days.toLocaleString();
      document.getElementById("hours").textContent = String(hours).padStart(2, "0");
      document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
      document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
    }

    updateCounter();
    setInterval(updateCounter, 1000);
  </script>
</body>
